[pytest]
# Puts both `ml/` itself (so `envs.trading_env` resolves) and the
# sibling `backend/` (so `app.strategy_engine.features` resolves) on
# sys.path -- the same two directories the Colab notebook adds via
# sys.path.insert, so a green run here is a reasonable proxy for the
# notebook's own imports working.
pythonpath = . ../backend
